version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    main: .
    binary: td
    ldflags:
      - -s -w
      - -X tokendog/cmd.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: tokendog
    repository:
      owner: uttej-badwane
      name: homebrew-tokendog
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/uttej-badwane/TokenDog"
    # Casks cap `desc` below 80 characters (brew style Cask/Desc).
    description: "Token-optimized CLI proxy for AI coding assistants"
    binaries:
      - td
    generate_completions_from_executable:
      args: ["completion"]
    # Stanzas goreleaser has no option for, emitted verbatim into the cask:
    #
    # - `tokendog` alias: the formula symlinked it; goreleaser's `binaries`
    #   can't set a target, so use Homebrew's native stanza (brew removes it
    #   on uninstall).
    # - Quarantine: casks (unlike formulae) are quarantined on download, and
    #   the binaries aren't signed or notarized, so Gatekeeper kills `td` with
    #   a "Not Opened" dialog. Clear the flag in preflight, because generating
    #   completions runs `td` before postflight (so goreleaser's documented
    #   `hooks.post.install` is too late). `preflight_steps` replaces the
    #   `preflight` block that Homebrew 7 deprecated; goreleaser's `hooks`
    #   still emit the old form.
    custom_block: |
      binary "td", target: "tokendog"

      preflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "td"], chdir: ".", writable_paths: ["td"]
        end
      end
    caveats: |
      ████████╗ ██████╗ ██╗  ██╗███████╗███╗   ██╗██████╗  ██████╗  ██████╗
      ╚══██╔══╝██╔═══██╗██║ ██╔╝██╔════╝████╗  ██║██╔══██╗██╔═══██╗██╔════╝
         ██║   ██║   ██║█████╔╝ █████╗  ██╔██╗ ██║██║  ██║██║   ██║██║  ███╗
         ██║   ██║   ██║██╔═██╗ ██╔══╝  ██║╚██╗██║██║  ██║██║   ██║██║   ██║
         ██║   ╚██████╔╝██║  ██╗███████╗██║ ╚████║██████╔╝╚██████╔╝╚██████╔╝
         ╚═╝    ╚═════╝ ╚═╝  ╚═╝╚══════╝╚═╝  ╚═══╝╚═════╝  ╚═════╝  ╚═════╝

      Token-optimized CLI proxy for AI coding assistants

      Run  td welcome   to see setup status and quick-start guide
      Run  td discover  to find unrewritten commands in your history
      Run  td gain      to see your current token savings
