name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Opt every JavaScript action into Node 24 ahead of GitHub's September 2026
# default flip. The actions we use (checkout, setup-go, goreleaser-action)
# are still on Node 20 internally; this env var forces them onto the new
# runtime so deprecation warnings stop and we keep working past the cutoff.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Build with the newest patch of go.mod's release line (e.g. 1.27.x),
      # not the exact `go 1.27.0` minimum, so release binaries carry every
      # stdlib security fix. Mirrors the go-version job in test.yml.
      - id: gomod
        run: |
          v=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' go.mod)
          test -n "$v" || { echo "::error::no go directive in go.mod"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.gomod.outputs.version }}
          check-latest: true
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          # Pin to v2.x major. "latest" emits a warning about implicit
          # version locking and risks a future major bump breaking the
          # release silently.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
