name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Opt every JavaScript action into Node 24 ahead of GitHub's September 2026
# default flip. Match release.yml so both workflows behave identically when
# the Node 20 runtime is removed from runners.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Resolve the Go release line (e.g. "1.27") from go.mod's `go` directive.
  # Jobs install the newest patch of that line rather than the exact
  # `go 1.27.0` minimum: `go-version-file` would pin the .0 release and miss
  # every stdlib security fix since. Dependency bumps that raise the
  # directive move CI along with them.
  go-version:
    name: resolve Go version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gomod.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: gomod
        run: |
          v=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' go.mod)
          test -n "$v" || { echo "::error::no go directive in go.mod"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  test:
    name: vet + race tests
    needs: go-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go-version.outputs.version }}
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  # Static analysis via golangci-lint (config in .golangci.yml). Uses the
  # action's prebuilt binary, so the linter version is decoupled from the CI
  # Go toolchain.
  lint:
    name: golangci-lint
    needs: go-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go-version.outputs.version }}
          check-latest: true
          cache: true
      # action v7+ is required for golangci-lint v2. The linter binary must be
      # built with a Go >= the module's, or it fails to typecheck the stdlib;
      # bump this alongside go.mod's `go` directive.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  # Compile on every target OS. The codebase has platform-specific files
  # (daemon_{darwin,linux,windows}.go, install_*.go), so an Ubuntu-only build
  # can't catch a macOS/Windows compile break — this matrix does.
  build:
    name: build (${{ matrix.os }})
    needs: go-version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go-version.outputs.version }}
          check-latest: true
          cache: true
      - run: go build ./...

  # Known-vulnerability scan of stdlib + reachable dependencies. Report-only:
  # the job stays green and emits a warning annotation when advisories are
  # found, so it surfaces issues in the PR without blocking on a transitive
  # CVE. Read the job log for the details; flip to blocking (drop the `|| …`)
  # once the team has triaged the findings.
  vulncheck:
    name: govulncheck (report-only)
    needs: go-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go-version.outputs.version }}
          check-latest: true
          cache: true
      - name: govulncheck
        # Pinned for reproducible scans. Older releases don't compile on newer
        # Go (v1.1.3's x/tools breaks on 1.27), so bump this alongside go.mod's
        # `go` directive.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./... || echo "::warning title=govulncheck::known advisories found (report-only, non-blocking) — see job log"
